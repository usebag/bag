# The size ceilings (decided 2026-10-25):
# the most physical source lines each component may hold. scripts/check-size.sh reads this file in
# scripts/last_step.sh and fails a component over its ceiling.
#
# The rule: each ceiling is the component's count on main on 2026-10-25, rounded up to a multiple of 100,
# plus 15 percent, rounded up to a multiple of 100 again: ceiling = 100 * ceil(115 * (100 * ceil(m / 100)) / 10000).
#
# The counting command, per component (physical lines, `wc -l` over the concatenation of the files):
#   TypeScript: find packages/<p>/src -type f -name '*.ts' ! -name '*.test.ts' ! -name '*.spec.ts' ! -path '*/test/*'
#               ! -path '*/tests/*' ! -path '*/fixtures/*' ! -path '*/__tests__/*' -print0 | xargs -0 cat | wc -l
#   Rust:       find crates/<c>/src -type f -name '*.rs' ! -name tests.rs ! -name testkit.rs ! -path '*/tests/*'
#               -print0 | xargs -0 cat | wc -l
# Rust test files are left out by name, as coverage-floors.toml leaves them out of coverage. An inline
# `#[cfg(test)] mod tests { ... }` with a body is counted as source (none existed on 2026-10-25: every #[cfg(test)]
# then declared a module in its own file, and those one-line declarations are counted).
#
# Ceilings are floors in reverse: a ceiling is raised only by a maintainer's decision entry, never
# by the PR that needs the room. scripts/check-size.sh fails any ceiling higher than the same ceiling on main, a
# component listed here with no files, and a packages/*/src or crates/*/src not listed here.
#
# Raised on 2026-10-26 for that night's work: DNS TXT discovery and handle records (the relay and both cores), the
# client side and petnames (cli, mcp and edge), and two further streams of work (edge and core; edge, core and cli).
# The rule stays: a ceiling is raised only by a maintainer's decision entry, and the gate still fails a raise
# against main, so this raise reaches the other branches through main.
#
# One table per component: `path` (a single-quoted literal string) and `ceiling` (an integer), one `key = value` per line.

