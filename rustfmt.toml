# Formatting for crates/: stable rustfmt options only, so the pinned stable toolchain applies every one of them.
# The width matches biome.json's lineWidth, so Rust and TypeScript read alike. `cargo fmt --all --check` gates it
# (scripts/last_step.sh, CI).
edition = "2024"
style_edition = "2024"
max_width = 110
use_small_heuristics = "Max"
newline_style = "Unix"
