[package]
name = "ac-relay"
description = "bag reference relay: publish, fetch and subscribe over HTTP and WebSocket, stored in SQLite."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ac-core = { path = "../ac-core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "=0.3.4"
# The server side of each connection (src/server.rs): hyper with a timer, so that its header read timeout runs
# (axum::serve sets no timer), and the tower glue. Already in Cargo.lock as axum's, with these features; it replaces
# `serde`, whose one use was a derive, as a direct dependency, so ac-relay keeps 12.
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "float_roundtrip"] }
tokio = { version = "=1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
# The HTTPS client of the domain resolver (src/resolver.rs): rustls on ring with webpki-roots, no gzip, no
# cookies, no proxy support compiled in beyond ureq's own (turned off in code).
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures-util = "=0.3.34"
tokio-tungstenite = "=0.29.0"
