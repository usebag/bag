# Stages @usebag/bag (packages/bag) on npm from one commit of main, with npm provenance; a maintainer publishes it.
# This file belongs in usebag/bag at .github/workflows/npm-publish.yml, beside relay-image.yml: the cut never carries
# .github/ (cut/MANIFEST), so, like relay-image.yml, it is added to the public repository by hand. It is kept here so
# that it is reviewed with the package it publishes.
# Started by hand only (workflow_dispatch). Only `run` steps: no third-party action. The input reaches the shell only
# through the environment (COMMIT), never inside a script as ${{ }}. Node is fetched from nodejs.org and checked
# against the SHA-256 written here. The version is the one in packages/bag/package.json at the commit; a version already
# on npm stops the run. npm records gitHead (the commit) and the provenance statement names this repository, this
# workflow and the commit.
# One path, staged publishing by the trusted publisher (organization usebag, repository bag, workflow npm-publish.yml),
# which allows `npm stage publish` and not `npm publish`: id-token write, no token, npm 11.15.0 or later
# (https://docs.npmjs.com/staged-publishing). The run stages the version and ends. Nothing is public until a maintainer
# approves it with 2FA, on npmjs.com (the Staged Packages tab, Approve) or with `npm stage approve <stage id>`. The
# trusted publisher's short-lived token can stage, but cannot list, view or approve a staged package
# (https://docs.npmjs.com/cli/v11/commands/npm-stage), so the run checks what it staged against npm's own output, and
# the registry is read after the approval, outside this run. A staged version is not on the registry, and npm refuses
# to stage or publish that version again. 0.1.0 was the first publish, with a token (run 41729441910); that path is gone.
name: npm publish
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "the 40-digit commit of main to stage from"
        required: true
permissions:
  contents: read
  id-token: write
env:
  NODE_VERSION: "24.22.1"
  NODE_SHA256: "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6"
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: install Node, and check npm is 11.15.0 or later (staged publishing)
        run: |
          f="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://nodejs.org/dist/v${NODE_VERSION}/$f"
          echo "${NODE_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/node/bin:$PATH"
          node --version
          echo "npm $(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number)
            if (a * 1e6 + b * 1e3 + c < 11 * 1e6 + 15 * 1e3 + 0) { console.error("npm " + process.argv[1] + " is older than 11.15.0"); process.exit(1) }
          ' "$(npm --version)"
      - name: check out the commit
        run: |
          case "$COMMIT" in *[!0-9a-f]*|"") echo "not a commit"; exit 1;; esac
          test "${#COMMIT}" = 40
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}" src
          git -C src fetch --quiet origin main
          git -C src checkout --detach "$COMMIT"
          git -C src merge-base --is-ancestor "$COMMIT" origin/main
        env:
          COMMIT: ${{ inputs.commit }}
      - name: the version, not yet on npm
        run: |
          cd src
          V="$(node -p 'require("./packages/bag/package.json").version')"
          echo "version $V"
          L="$(npm view @usebag/bag version)" || { echo "npm view @usebag/bag failed: the trusted publisher stages only a package that exists"; exit 1; }
          echo "@usebag/bag exists (latest $L): staging by trusted publishing (OIDC)"
          if npm view "@usebag/bag@$V" version 2>/dev/null | grep -q .; then echo "@usebag/bag@$V is on npm already"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: install, test and build
        run: |
          cd src
          npm ci --no-audit --no-fund
          npm test -w packages/bag
          npm run build -w packages/bag
          test "$(node packages/bag/dist/bag.js --version)" = "bag $VERSION $COMMIT"
          test -s packages/bag/dist/LICENSE
          test -z "$(git status --porcelain --untracked-files=no)"
        env:
          COMMIT: ${{ inputs.commit }}
      - name: pack, and record the tarball's hashes
        run: |
          cd src
          npm pack -w packages/bag --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
          T="$RUNNER_TEMP/usebag-bag-$VERSION.tgz"
          node -e 'const [p] = require(process.argv[1]); for (const f of p.files) console.log(f.size, f.path); console.log(p.filename, p.size, "bytes packed", p.unpackedSize, "unpacked", p.entryCount, "files"); console.log("integrity", p.integrity)' "$RUNNER_TEMP/pack.json"
          echo "sha256 $(sha256sum "$T" | cut -d' ' -f1)"
          echo "INTEGRITY=$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack.json")" >> "$GITHUB_ENV"
      - name: stage by trusted publishing (OIDC, no token), with provenance
        run: |
          cd src
          echo "path: npm stage publish, trusted publishing (OIDC)"
          test -z "${NODE_AUTH_TOKEN:-}"
          npm stage publish -w packages/bag --provenance --access public --json > "$RUNNER_TEMP/stage.json" || { cat "$RUNNER_TEMP/stage.json"; exit 1; }
      - name: npm staged the tarball packed above
        run: |
          node -e '
            const p = require(process.argv[1])["@usebag/bag"] || {}
            const { VERSION, INTEGRITY, COMMIT } = process.env
            if (p.version !== VERSION || p.integrity !== INTEGRITY) { console.error("npm staged " + p.id + ", " + p.integrity + "; packed @usebag/bag@" + VERSION + ", " + INTEGRITY); process.exit(1) }
            console.log("staged @usebag/bag@" + VERSION + " from " + COMMIT + ", stage id " + (p.stageId || "none in npm output") + ", " + INTEGRITY)
          ' "$RUNNER_TEMP/stage.json"
        env:
          COMMIT: ${{ inputs.commit }}
