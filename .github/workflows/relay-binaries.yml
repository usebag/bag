# Builds the reference relay, ac-relay, as release binaries from one public cut commit of main (docs/release.md in the
# cut, "Relay binaries"), and, given a version, uploads them to that version's GitHub Release.
# This file belongs in usebag/bag at .github/workflows/relay-binaries.yml, beside release.yml: the cut never carries
# .github/ (cut/MANIFEST), so it reaches the public repository by its own PR. It is kept here so that it is reviewed
# with the release process it serves.
# Started by hand only (workflow_dispatch). Only `run` steps: no third-party action. The inputs reach the shell only
# through the environment (COMMIT, VERSION), never inside a script as ${{ }}.
# Three targets, each on its own native runner: x86_64-unknown-linux-musl (ubuntu-24.04) and aarch64-unknown-linux-musl
# (ubuntu-24.04-arm), linked statically with musl so that one binary runs on any Linux of its architecture, and
# aarch64-apple-darwin (macos-15). The relay compiles C (SQLite, bundled by rusqlite, and parts of ring), so the Linux
# jobs install Ubuntu's musl-tools for musl-gcc. The toolchain is rust-toolchain.toml's channel.
# Each archive, ac-relay-<name>-<target>.tar.gz (<name> is vX.Y.Z given a version, else the commit), holds the binary,
# LICENSE and THIRD-PARTY.md. It is signed keyless with cosign, a pinned release downloaded from sigstore/cosign and
# checked against the sha256 written here per platform: the signature is bound to this workflow's identity by the job's
# OIDC token, logged in Sigstore's transparency log, and kept as <archive>.sigstore.json.
# Without a version the run builds, checks, signs and prints the hashes, and uploads nothing. Given a version, the
# Release vX.Y.Z must exist on this commit (release.yml makes it); each build job uploads its archive and bundle, and
# the last job checks every archive's signature, writes SHA256SUMS, signs it and uploads both. An existing asset is
# never replaced: gh release upload without --clobber stops on it.
name: relay binaries
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "the 40-digit public cut commit of main to build"
        required: true
      version:
        description: "X.Y.Z: upload to the Release vX.Y.Z on this commit (empty: build, sign and check only)"
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: relay-binaries
  cancel-in-progress: false
env:
  COSIGN_VERSION: "v3.1.4"
  OIDC_ISSUER: "https://token.actions.githubusercontent.com"
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cosign: linux-amd64
            cosign_sha256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cosign: linux-arm64
            cosign_sha256: "ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2"
          - target: aarch64-apple-darwin
            runner: macos-15
            cosign: darwin-arm64
            cosign_sha256: "9f9b8cd557cf2e5b3df3373a00baa005a86b02391e3e06dd0ce37b3a1533d3a4"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: the inputs, and check out the commit
        run: |
          case "$COMMIT" in *[!0-9a-f]*|"") echo "not a commit"; exit 1;; esac
          test "${#COMMIT}" = 40
          if [ -n "$VERSION" ]; then
            printf '%s\n' "$VERSION" | grep -q -x -E '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "not a version X.Y.Z"; exit 1; }
          fi
          git clone --no-checkout --quiet "https://github.com/${GITHUB_REPOSITORY}" src
          git -C src fetch --quiet origin main
          git -C src checkout --quiet --detach "$COMMIT"
          git -C src merge-base --is-ancestor "$COMMIT" origin/main
          git -C src log -1 --format=%s "$COMMIT" | grep -q '^bag public cut of ' || { echo "$COMMIT is not a public cut commit"; exit 1; }
          test -s src/LICENSE && test -s src/THIRD-PARTY.md || { echo "the commit has no LICENSE or no THIRD-PARTY.md"; exit 1; }
          N="$COMMIT"
          if [ -n "$VERSION" ]; then
            test "$(git -C src ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$COMMIT" || { echo "the tag v$VERSION is not on $COMMIT: release.yml makes it"; exit 1; }
            gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "no Release v$VERSION: release.yml makes it"; exit 1; }
            N="v$VERSION"
          fi
          echo "ARCHIVE=ac-relay-$N-$TARGET.tar.gz" >> "$GITHUB_ENV"
          echo "ac-relay-$N-$TARGET.tar.gz from $COMMIT"
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: cosign, the pinned release, checked against its sha256
        run: |
          curl -fsSLo "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${COSIGN_ASSET}"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" version
        env:
          COSIGN_ASSET: ${{ matrix.cosign }}
          COSIGN_SHA256: ${{ matrix.cosign_sha256 }}
      - name: the Rust toolchain of rust-toolchain.toml, the target, and musl-gcc on Linux
        run: |
          cd src
          CH="$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$CH" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$CH" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --target "$TARGET"
          rustc --version
          cargo --version
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
            musl-gcc --version | head -n 1
          fi
        env:
          TARGET: ${{ matrix.target }}
      - name: build, and check the binary
        run: |
          cd src
          if [ "$RUNNER_OS" = Linux ]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --release --locked -p ac-relay --target "$TARGET"
          B="target/$TARGET/release/ac-relay"
          "$B" --version
          file "$B"
          if [ "$RUNNER_OS" = Linux ]; then
            file "$B" | grep -q -E 'statically linked|static-pie linked' || { echo "$B is not linked statically"; exit 1; }
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
        env:
          TARGET: ${{ matrix.target }}
      - name: the archive, signed keyless
        run: |
          mkdir "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/out"
          cp "src/target/$TARGET/release/ac-relay" src/LICENSE src/THIRD-PARTY.md "$RUNNER_TEMP/pkg/"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/out/$ARCHIVE" -C "$RUNNER_TEMP/pkg" ac-relay LICENSE THIRD-PARTY.md
          cd "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE"
          "$RUNNER_TEMP/cosign" verify-blob --bundle "$ARCHIVE.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" "$ARCHIVE"
          echo "sha256 $(shasum -a 256 "$ARCHIVE" | cut -c1-64)  $ARCHIVE"
        env:
          TARGET: ${{ matrix.target }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
      - name: upload the archive and its signature to the Release
        if: inputs.version != ''
        run: |
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/out/$ARCHIVE" "$RUNNER_TEMP/out/$ARCHIVE.sigstore.json"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sums:
    needs: build
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - name: cosign, the pinned release, checked against its sha256
        run: |
          curl -fsSLo "$RUNNER_TEMP/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/cosign" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/cosign"
      - name: every archive's signature, then SHA256SUMS, signed and uploaded
        run: |
          printf '%s\n' "$VERSION" | grep -q -x -E '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' || { echo "not a version X.Y.Z"; exit 1; }
          mkdir "$RUNNER_TEMP/d"
          cd "$RUNNER_TEMP/d"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'ac-relay-*'
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            A="ac-relay-v$VERSION-$t.tar.gz"
            "$RUNNER_TEMP/cosign" verify-blob --bundle "$A.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER" "$A"
          done
          sha256sum "ac-relay-v$VERSION-x86_64-unknown-linux-musl.tar.gz" "ac-relay-v$VERSION-aarch64-unknown-linux-musl.tar.gz" "ac-relay-v$VERSION-aarch64-apple-darwin.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          "$RUNNER_TEMP/cosign" sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" SHA256SUMS SHA256SUMS.sigstore.json
        env:
          VERSION: ${{ inputs.version }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
