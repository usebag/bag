# Builds the relay image from one commit of main and pushes it to ghcr.io/usebag/relay:<commit>.
# This file belongs in usebag/bag at .github/workflows/relay-image.yml, beside npm-publish.yml and release.yml: the cut
# never carries .github/ (cut/MANIFEST), so it reaches the public repository by its own PR. It is kept here so that it
# is reviewed with the release process it serves (docs/release.md in the cut, step 7).
# Started two ways: by hand (workflow_dispatch), and called by release.yml (workflow_call) with the release commit.
# Each platform builds on its own native runner, so no QEMU and no third-party action or image; the two digests are
# merged into one manifest list at the end. Only `run` steps. The input reaches the shell only through the environment
# (COMMIT), never inside a script as ${{ }}. The package is private when first pushed; making it public is a person's
# act on the package page.
# An image of the commit that exists already, with both platforms, is not built again: the first job reads it and the
# run ends with a line, so a second run for the same commit, by hand or from release.yml, neither fails nor rebuilds.
# Called, the run's output `digest` is the image's digest, read or built.
name: relay image
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "the 40-digit commit of main to build"
        required: true
  workflow_call:
    inputs:
      commit:
        description: "the 40-digit commit of main to build"
        required: true
        type: string
    outputs:
      digest:
        description: "the digest of ghcr.io/usebag/relay:<commit>"
        value: ${{ jobs.exists.outputs.digest || jobs.manifest.outputs.digest }}
permissions:
  contents: read
  packages: write
jobs:
  exists:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.read.outputs.digest }}
    steps:
      - name: the image of the commit, if it exists already with both platforms
        id: read
        run: |
          case "$COMMIT" in *[!0-9a-f]*|"") echo "not a commit"; exit 1;; esac
          test "${#COMMIT}" = 40
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          I="ghcr.io/${GITHUB_REPOSITORY_OWNER}/relay"
          if M="$(docker buildx imagetools inspect "$I:$COMMIT" --format '{{json .Manifest}}' 2>/dev/null)"; then
            P="$(printf '%s' "$M" | jq -r '[.manifests[]? | .platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(" ")')"
            if [ "$P" = "linux/amd64 linux/arm64" ]; then
              D="$(printf '%s' "$M" | jq -r .digest)"
              echo "the image $I:$COMMIT exists already, $D ($P): nothing to build"
              echo "digest=$D" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "the image $I:$COMMIT exists with the platforms '$P', not both: building it again"
          else
            echo "no image $I:$COMMIT yet: building it"
          fi
        env:
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: exists
    if: needs.exists.outputs.digest == ''
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: check out the commit
        run: |
          case "$COMMIT" in *[!0-9a-f]*|"") echo "not a commit"; exit 1;; esac
          test "${#COMMIT}" = 40
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}" src
          git -C src fetch --quiet origin main
          git -C src checkout --detach "$COMMIT"
          git -C src merge-base --is-ancestor "$COMMIT" origin/main
        env:
          COMMIT: ${{ inputs.commit }}
      - name: build and push one platform by digest
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name relay --driver docker-container
          cd src
          docker buildx build --platform "$PLATFORM" -f deploy/docker/Dockerfile \
            --build-arg AC_REV="$COMMIT" --provenance=mode=max --sbom=true \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/relay:${COMMIT}-${SUFFIX}" --push .
        env:
          COMMIT: ${{ inputs.commit }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: merge the two platforms into one tag
        id: merge
        run: |
          case "$COMMIT" in *[!0-9a-f]*|"") echo "not a commit"; exit 1;; esac
          test "${#COMMIT}" = 40
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          I="ghcr.io/${GITHUB_REPOSITORY_OWNER}/relay"
          docker buildx imagetools create -t "$I:$COMMIT" "$I:${COMMIT}-amd64" "$I:${COMMIT}-arm64"
          docker buildx imagetools inspect "$I:$COMMIT"
          D="$(docker buildx imagetools inspect "$I:$COMMIT" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$D" in sha256:*) ;; *) echo "no digest for $I:$COMMIT"; exit 1;; esac
          echo "digest=$D" >> "$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
